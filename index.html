<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tier List MCOC - TheShori</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    body { background-color: #0b0c10; color: #f3f4f6; font-family: 'Segoe UI', system-ui, sans-serif; }
    
    .clase-Mutante { border-left: 4px solid #eab308; background: linear-gradient(90deg, rgba(234,179,8,0.12) 0%, rgba(17,24,39,0.95) 100%); }
    .clase-Habil { border-left: 4px solid #ef4444; background: linear-gradient(90deg, rgba(239,68,68,0.12) 0%, rgba(17,24,39,0.95) 100%); }
    .clase-Cientifico { border-left: 4px solid #22c55e; background: linear-gradient(90deg, rgba(34,197,94,0.12) 0%, rgba(17,24,39,0.95) 100%); }
    .clase-Mistico { border-left: 4px solid #a855f7; background: linear-gradient(90deg, rgba(168,85,247,0.12) 0%, rgba(17,24,39,0.95) 100%); }
    .clase-Cosmico { border-left: 4px solid #38bdf8; background: linear-gradient(90deg, rgba(56,189,248,0.12) 0%, rgba(17,24,39,0.95) 100%); }
    .clase-Tecnologico { border-left: 4px solid #3b82f6; background: linear-gradient(90deg, rgba(59,130,246,0.12) 0%, rgba(17,24,39,0.95) 100%); }

    .char-card { transition: transform 0.12s ease, box-shadow 0.12s ease; cursor: pointer; user-select: none; }
    .char-card:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.65); }
    .drop-zone { min-height: 120px; }
    .sortable-ghost { opacity: 0.35; border: 2px dashed #a855f7; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- BARRA SUPERIOR -->
  <header class="bg-gray-900/95 backdrop-blur border-b border-gray-800 px-6 py-3.5 flex flex-wrap justify-between items-center gap-3 sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <span class="text-xl md:text-2xl font-extrabold tracking-wider bg-gradient-to-r from-purple-400 to-amber-400 bg-clip-text text-transparent">
        MCOC TIER LIST
      </span>
      <span id="statusBadge" class="text-xs px-2.5 py-1 rounded-full bg-gray-800 text-gray-400 border border-gray-700">
        Modo Visitante
      </span>
    </div>

    <div class="flex items-center gap-2.5">
      <button id="btnAddChar" onclick="openFormModal()" class="hidden bg-purple-600 hover:bg-purple-500 text-white font-semibold px-3.5 py-2 rounded-lg text-xs md:text-sm transition">
        + Añadir Personaje
      </button>

      <button id="btnAdminAuth" onclick="handleAuthButtonClick()" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-200 px-3.5 py-2 rounded-lg text-xs md:text-sm font-medium transition">
        🔒 Acceso Admin
      </button>
    </div>
  </header>

  <!-- BARRA DE FILTROS DE ETIQUETAS -->
  <section class="bg-gray-900/60 border-b border-gray-800/80 px-6 py-3">
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-xs font-bold uppercase tracking-wider text-gray-400 mr-1">Filtrar por etiquetas (coincidentes):</span>
      <div id="filterBar" class="flex flex-wrap gap-1.5"></div>
      <button id="btnClearFilters" onclick="clearFilters()" class="hidden text-xs text-red-400 hover:text-red-300 underline ml-2">
        Limpiar filtros
      </button>
    </div>
  </section>

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="flex flex-1 overflow-hidden">
    <main class="flex-1 p-4 md:p-6 overflow-x-auto overflow-y-auto">
      <div id="tiersContainer" class="space-y-8 min-w-[1000px] max-w-[1600px] mx-auto"></div>
    </main>

    <aside id="sidebarBench" class="w-80 bg-gray-900 border-l border-gray-800 p-4 flex flex-col hidden">
      <div class="mb-3">
        <h2 class="text-sm font-bold text-white flex items-center justify-between">
          <span>📥 Nuevos / Sin Clasificar</span>
          <span id="benchCount" class="bg-purple-600 text-xs px-2 py-0.5 rounded-full">0</span>
        </h2>
        <p class="text-xs text-gray-400 mt-1">Arrastra los personajes nuevos desde aquí a su Tier y Clase correspondiente.</p>
      </div>
      <div id="benchDropZone" data-tier="BENCH" data-clase="ALL" class="drop-zone flex-1 bg-gray-950/80 border-2 border-dashed border-gray-800 rounded-xl p-2.5 space-y-2 overflow-y-auto"></div>
    </aside>
  </div>

  <!-- MODAL LOGIN ADMIN -->
  <div id="loginModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
    <div class="bg-gray-900 border border-gray-700 rounded-2xl max-w-sm w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-white">🔒 Iniciar Sesión Admin</h3>
        <button onclick="closeLoginModal()" class="text-gray-400 hover:text-white text-xl">&times;</button>
      </div>

      <form id="loginForm" onsubmit="submitAdminLogin(event)" class="space-y-4 text-sm">
        <div>
          <label class="block text-gray-300 mb-1 font-medium">Correo electrónico</label>
          <input type="email" id="loginEmail" required value="thesoriplayer@gmail.com" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
        </div>
        <div>
          <label class="block text-gray-300 mb-1 font-medium">Contraseña</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
        </div>
        <p id="loginErrorMsg" class="text-xs text-red-400 hidden"></p>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeLoginModal()" class="px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300">Cancelar</button>
          <button type="submit" id="btnSubmitLogin" class="px-4 py-2 rounded-lg bg-purple-600 hover:bg-purple-500 text-white font-semibold">Entrar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL CREAR / EDITAR PERSONAJE -->
  <div id="formModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
    <div class="bg-gray-900 border border-gray-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 id="formModalTitle" class="text-lg font-bold text-white">Añadir Personaje</h3>
        <button onclick="closeFormModal()" class="text-gray-400 hover:text-white text-xl">&times;</button>
      </div>

      <form id="charForm" onsubmit="submitCharForm(event)" class="space-y-4 text-sm">
        <input type="hidden" id="editCharId">
        <div>
          <label class="block text-gray-300 mb-1 font-medium">Nombre del Personaje *</label>
          <input type="text" id="charName" required placeholder="Ej: Onslaught" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-gray-300 mb-1 font-medium">Clase *</label>
            <select id="charClass" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
              <option value="Mutante">Mutante</option>
              <option value="Habil">Hábil</option>
              <option value="Cientifico">Científico</option>
              <option value="Mistico">Místico</option>
              <option value="Cosmico">Cósmico</option>
              <option value="Tecnologico">Tecnológico</option>
            </select>
          </div>
          <div>
            <label class="block text-gray-300 mb-1 font-medium">URL Avatar (Opcional)</label>
            <input type="url" id="charImg" placeholder="https://..." class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
          </div>
        </div>

        <div>
          <label class="block text-gray-300 mb-1.5 font-medium">Etiquetas Oficiales (Leyenda MCOC)</label>
          <div id="formTagsContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-2 bg-gray-950/70 p-3 rounded-xl border border-gray-800 max-h-56 overflow-y-auto"></div>
        </div>

        <div>
          <label class="block text-gray-300 mb-1 font-medium">Características / Rotación / Notas</label>
          <textarea id="charNotes" rows="3" placeholder="Detalles sobre su rotación, reliquia ideal..." class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white"></textarea>
        </div>

        <div>
          <label class="block text-gray-300 mb-1 font-medium">Enlace a tu Vídeo de YouTube</label>
          <input type="url" id="charYoutube" placeholder="https://www.youtube.com/watch?v=..." class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeFormModal()" class="px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300">Cancelar</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-purple-600 hover:bg-purple-500 text-white font-semibold">Guardar Personaje</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL DETALLE + YOUTUBE -->
  <div id="detailModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
    <div class="bg-gray-900 border border-gray-700 rounded-2xl max-w-2xl w-full overflow-hidden shadow-2xl">
      <div class="p-5 border-b border-gray-800 flex justify-between items-start">
        <div class="flex items-center gap-3.5">
          <img id="detailImg" src="" alt="Avatar" class="w-14 h-14 rounded-xl object-cover border border-gray-600 hidden">
          <div>
            <h3 id="detailName" class="text-xl md:text-2xl font-extrabold text-white"></h3>
            <span id="detailClassBadge" class="inline-block mt-1 text-xs px-2.5 py-0.5 rounded-full font-semibold bg-gray-800 text-gray-300"></span>
            <div id="detailTags" class="flex flex-wrap gap-1.5 mt-2"></div>
          </div>
        </div>
        <button onclick="closeDetailModal()" class="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
      </div>

      <div class="p-5 space-y-4 max-h-[75vh] overflow-y-auto">
        <div>
          <h4 class="text-xs font-bold uppercase tracking-wider text-purple-400 mb-1.5">Características y Análisis</h4>
          <p id="detailNotes" class="text-gray-200 text-sm whitespace-pre-line bg-gray-950/70 p-3.5 rounded-xl border border-gray-800"></p>
        </div>

        <div id="detailVideoSection" class="hidden">
          <h4 class="text-xs font-bold uppercase tracking-wider text-red-400 mb-1.5">📺 Análisis en YouTube</h4>
          <div class="aspect-video w-full rounded-xl overflow-hidden border border-gray-800 bg-black">
            <iframe id="detailYoutubeIframe" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
        </div>

        <div id="adminActionsContainer" class="hidden pt-3 border-t border-gray-800 flex justify-between items-center">
          <button id="btnEditExisting" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3.5 py-2 rounded-lg">
            ✏️ Editar Personaje / Vídeo
          </button>
          <button id="btnDeleteChar" class="text-xs text-red-400 hover:text-red-300 underline">
            Eliminar personaje
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_EMAIL = "thesoriplayer@gmail.com";

    const firebaseConfig = {
      apiKey: "AIzaSyBadVGulkyDSHjSWbkDAjtYRfyefQBea6A",
      authDomain: "tier-list-nuevo.firebaseapp.com",
      projectId: "tier-list-nuevo",
      storageBucket: "tier-list-nuevo.firebasestorage.app",
      messagingSenderId: "1031884662220",
      appId: "1:1031884662220:web:2767dfa2a5880e5a902969"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const AVAILABLE_TAGS = [
      { id: 'asc7',       label: '⬆️ Ascensión 7 Estrellas', color: 'bg-blue-950/90 text-blue-300 border-blue-700/80' },
      { id: 'gbasico',    label: '💜 7 Estrellas Grupo Básico', color: 'bg-purple-950/90 text-purple-300 border-purple-700/80' },
      { id: 'gtitan',     label: '💚 7 Estrellas Cristal Titán', color: 'bg-emerald-950/90 text-emerald-300 border-emerald-700/80' },
      { id: 'glealtad',   label: '🩷 7 Estrellas Cristal Lealtad', color: 'bg-pink-950/90 text-pink-300 border-pink-700/80' },
      { id: 'gincursion', label: '💛 7 Estrellas Cristal Incursión', color: 'bg-amber-950/90 text-amber-300 border-amber-700/80' },
      { id: 'geventos',   label: '🖤 7 Estrellas Eventos', color: 'bg-gray-800 text-gray-200 border-gray-600' },
      { id: 'gsagas',     label: '🩷 7 Estrellas Sagas', color: 'bg-rose-950/90 text-rose-300 border-rose-700/80' },
      { id: 'gvalentin',  label: '💖 7 Estrellas San Valentín', color: 'bg-red-950/90 text-red-300 border-red-700/80' },
      { id: 'gbanquete',  label: '🩶 7 Estrellas Banquete 2025', color: 'bg-slate-800 text-slate-200 border-slate-600' },
      { id: 'habilidad',  label: '⭐ Habilidad Despertada', color: 'bg-yellow-950/90 text-yellow-300 border-yellow-700/80' },
      { id: 'singalta',   label: '🔝 Singularidad Alta', color: 'bg-orange-950/90 text-orange-300 border-orange-700/80' },
      { id: 'suicidas',   label: '💀 Amigable Maestrías Suicidas', color: 'bg-stone-900 text-stone-300 border-stone-700' },
      { id: 'sinergias',  label: '🤝 Se Vuelve Mejor con Sinergias', color: 'bg-teal-950/90 text-teal-300 border-teal-700/80' },
      { id: 'saberjugar', label: '🎮 Requiere Saber Jugar Con Él', color: 'bg-indigo-950/90 text-indigo-300 border-indigo-700/80' },
      { id: 'defensor',   label: '🛡️ Gran Defensor', color: 'bg-cyan-950/90 text-cyan-300 border-cyan-700/80' },
      { id: 'construccion', label: '🔨 Requiere Construcción', color: 'bg-amber-900/80 text-amber-200 border-amber-600' },
      { id: 'polvos',     label: '💎 Polvos Primordiales', color: 'bg-sky-950/90 text-sky-300 border-sky-700/80' },
      { id: 'hasta6',     label: '🟦 Disponible Hasta 6 Estrellas', color: 'bg-blue-900/80 text-blue-200 border-blue-600' },
      { id: 'hasta5',     label: '🔴 Disponible Hasta 5 Estrellas', color: 'bg-red-900/80 text-red-200 border-red-600' }
    ];

    // ORDEN EXACTO SOLICITADO DE ARRIBA A ABAJO
    const TIERS = [
      { id: 'GOAT',        name: 'GOAT TIER',        color: 'from-amber-400 via-yellow-500 to-amber-600 text-black border-yellow-400' },
      { id: 'GOD',         name: 'GOD TIER',         color: 'from-purple-600 via-indigo-600 to-purple-700 text-white border-purple-500' },
      { id: 'SEMIGOD',     name: 'SEMI-GOD TIER',    color: 'from-blue-600 via-cyan-600 to-blue-700 text-white border-cyan-500' },
      { id: 'USABLES',     name: 'USABLES TIER',     color: 'from-emerald-600 via-teal-600 to-emerald-700 text-white border-emerald-500' },
      { id: 'OCASIONALES', name: 'OCASIONALES TIER', color: 'from-orange-600 via-amber-700 to-orange-800 text-white border-orange-500' },
      { id: 'MEME',        name: 'MEME TIER',        color: 'from-red-700 via-rose-900 to-red-950 text-white border-red-600' }
    ];

    const CLASES = [
      { id: 'Mutante',     label: 'MUTANTES',     headerStyle: 'bg-yellow-950/40 text-yellow-400 border-yellow-700/50' },
      { id: 'Habil',       label: 'HÁBILES',      headerStyle: 'bg-red-950/40 text-red-400 border-red-700/50' },
      { id: 'Cientifico',  label: 'CIENTÍFICOS',  headerStyle: 'bg-green-950/40 text-green-400 border-green-700/50' },
      { id: 'Mistico',     label: 'MÍSTICOS',     headerStyle: 'bg-purple-950/40 text-purple-400 border-purple-700/50' },
      { id: 'Cosmico',     label: 'CÓSMICOS',     headerStyle: 'bg-sky-950/40 text-sky-400 border-sky-700/50' },
      { id: 'Tecnologico', label: 'TECNOLÓGICOS', headerStyle: 'bg-blue-950/40 text-blue-400 border-blue-700/50' }
    ];

    let characters = [];
    let activeFilters = [];
    let isAdmin = false;
    let sortableInstances = [];

    // =========================================================================
    // AUTENTICACIÓN
    // =========================================================================
    auth.onAuthStateChanged(user => {
      if (user && user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
        setAdminMode(true, user.email);
      } else if (user) {
        alert(`Acceso denegado: Solo ${ADMIN_EMAIL} tiene permisos de administrador.`);
        auth.signOut();
        setAdminMode(false);
      } else {
        setAdminMode(false);
      }
    });

    function handleAuthButtonClick() {
      if (isAdmin) {
        auth.signOut();
      } else {
        document.getElementById('loginErrorMsg').classList.add('hidden');
        document.getElementById('loginPassword').value = '';
        document.getElementById('loginModal').classList.remove('hidden');
        document.getElementById('loginModal').classList.add('flex');
      }
    }

    function closeLoginModal() {
      document.getElementById('loginModal').classList.add('hidden');
      document.getElementById('loginModal').classList.remove('flex');
    }

    function submitAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value;
      const errEl = document.getElementById('loginErrorMsg');
      const btn = document.getElementById('btnSubmitLogin');

      if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        errEl.innerText = `Solo el correo ${ADMIN_EMAIL} está autorizado.`;
        errEl.classList.remove('hidden');
        return;
      }

      btn.innerText = 'Verificando...';
      btn.disabled = true;

      auth.signInWithEmailAndPassword(email, pass)
        .then(() => {
          closeLoginModal();
        })
        .catch(() => {
          errEl.innerText = 'Error: Correo o contraseña incorrectos.';
          errEl.classList.remove('hidden');
        })
        .finally(() => {
          btn.innerText = 'Entrar';
          btn.disabled = false;
        });
    }

    function setAdminMode(enabled, email = '') {
      isAdmin = enabled;
      const badge = document.getElementById('statusBadge');
      const btnAdd = document.getElementById('btnAddChar');
      const bench = document.getElementById('sidebarBench');
      const btnAuth = document.getElementById('btnAdminAuth');

      if (isAdmin) {
        badge.innerText = `✅ Admin: ${email}`;
        badge.className = 'text-xs px-2.5 py-1 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-700';
        btnAdd.classList.remove('hidden');
        bench.classList.remove('hidden');
        btnAuth.innerText = 'Cerrar sesión';
      } else {
        badge.innerText = 'Modo Visitante';
        badge.className = 'text-xs px-2.5 py-1 rounded-full bg-gray-800 text-gray-400 border border-gray-700';
        btnAdd.classList.add('hidden');
        bench.classList.add('hidden');
        btnAuth.innerText = '🔒 Acceso Admin';
      }
      initDragAndDrop();
    }

    // =========================================================================
    // CARGA Y GUARDADO DE DATOS
    // =========================================================================
    function initData() {
      renderFilterBar();
      renderFormTagCheckboxes();

      db.collection('tierlist').doc('main').onSnapshot(doc => {
        if (doc.exists && doc.data().characters) {
          characters = doc.data().characters;
        } else {
          characters = [];
        }
        renderBoard();
      }, () => {
        characters = [];
        renderBoard();
      });
    }

    function persistChanges() {
      if (isAdmin) {
        db.collection('tierlist').doc('main').set({
          characters: characters,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }).catch(err => console.error("Error guardando en Firestore:", err));
      }
    }

    // =========================================================================
    // RENDERIZADO
    // =========================================================================
    function renderBoard() {
      const container = document.getElementById('tiersContainer');
      container.innerHTML = '';

      TIERS.forEach(tier => {
        const tierSection = document.createElement('section');
        tierSection.className = 'bg-gray-900/40 border border-gray-800 rounded-2xl p-4 shadow-lg space-y-3';

        const tierBanner = document.createElement('div');
        tierBanner.className = `w-full bg-gradient-to-r ${tier.color} border font-extrabold text-base md:text-lg tracking-widest uppercase py-2.5 px-4 rounded-xl text-center shadow-md`;
        tierBanner.innerText = tier.name;
        tierSection.appendChild(tierBanner);

        const classHeadersGrid = document.createElement('div');
        classHeadersGrid.className = 'grid grid-cols-6 gap-2.5 text-center font-bold text-xs uppercase tracking-wider';
        CLASES.forEach(cl => {
          const chHeader = document.createElement('div');
          chHeader.className = `${cl.headerStyle} p-2 rounded-lg border`;
          chHeader.innerText = cl.label;
          classHeadersGrid.appendChild(chHeader);
        });
        tierSection.appendChild(classHeadersGrid);

        const columnsGrid = document.createElement('div');
        columnsGrid.className = 'grid grid-cols-6 gap-2.5';

        CLASES.forEach(cl => {
          const cell = document.createElement('div');
          cell.className = 'drop-zone bg-gray-950/60 rounded-xl p-2 border border-gray-800/70 space-y-2 flex flex-col';
          cell.dataset.tier = tier.id;
          cell.dataset.clase = cl.id;

          const cellChars = characters.filter(c => c.tier === tier.id && c.clase === cl.id && matchesActiveFilters(c));
          cellChars.forEach(ch => cell.appendChild(createCharCard(ch)));

          columnsGrid.appendChild(cell);
        });

        tierSection.appendChild(columnsGrid);
        container.appendChild(tierSection);
      });

      const benchZone = document.getElementById('benchDropZone');
      benchZone.innerHTML = '';
      const benchChars = characters.filter(c => c.tier === 'BENCH' && matchesActiveFilters(c));
      benchChars.forEach(ch => benchZone.appendChild(createCharCard(ch)));
      document.getElementById('benchCount').innerText = benchChars.length;

      initDragAndDrop();
    }

    function createCharCard(ch) {
      const card = document.createElement('div');
      card.className = `char-card clase-${ch.clase} rounded-lg p-2.5 text-xs flex flex-col gap-1.5 bg-gray-900 shadow-sm border border-gray-800/80`;
      card.dataset.id = ch.id;
      card.onclick = () => openDetailModal(ch.id);

      const topRow = document.createElement('div');
      topRow.className = 'flex items-center gap-2';

      if (ch.img) {
        const avatar = document.createElement('img');
        avatar.src = ch.img;
        avatar.className = 'w-6 h-6 rounded-full object-cover flex-shrink-0 border border-gray-600';
        topRow.appendChild(avatar);
      }

      const nameSpan = document.createElement('span');
      nameSpan.className = 'font-bold text-gray-100 text-xs leading-tight';
      nameSpan.innerText = ch.name;
      topRow.appendChild(nameSpan);
      card.appendChild(topRow);

      if (ch.tags && ch.tags.length > 0) {
        const tagsWrap = document.createElement('div');
        tagsWrap.className = 'flex flex-wrap gap-1';
        ch.tags.forEach(tagId => {
          const tagObj = AVAILABLE_TAGS.find(t => t.id === tagId);
          if (tagObj) {
            const badge = document.createElement('span');
            badge.className = `text-[10px] px-1.5 py-0.5 rounded border font-medium leading-none ${tagObj.color}`;
            badge.innerText = tagObj.label;
            tagsWrap.appendChild(badge);
          }
        });
        card.appendChild(tagsWrap);
      }

      return card;
    }

    // =========================================================================
    // FILTROS Y DRAG & DROP
    // =========================================================================
    function renderFilterBar() {
      const bar = document.getElementById('filterBar');
      bar.innerHTML = '';

      AVAILABLE_TAGS.forEach(tag => {
        const isSelected = activeFilters.includes(tag.id);
        const btn = document.createElement('button');
        btn.className = `text-xs px-2.5 py-1 rounded-md border font-medium transition ${tag.color} ${isSelected ? 'ring-2 ring-white opacity-100' : 'opacity-60 hover:opacity-90'}`;
        btn.innerText = tag.label;
        btn.onclick = () => {
          if (activeFilters.includes(tag.id)) {
            activeFilters = activeFilters.filter(id => id !== tag.id);
          } else {
            activeFilters.push(tag.id);
          }
          renderFilterBar();
          renderBoard();
        };
        bar.appendChild(btn);
      });

      document.getElementById('btnClearFilters').classList.toggle('hidden', activeFilters.length === 0);
    }

    function clearFilters() {
      activeFilters = [];
      renderFilterBar();
      renderBoard();
    }

    function matchesActiveFilters(char) {
      if (activeFilters.length === 0) return true;
      const charTags = char.tags || [];
      return activeFilters.every(filterId => charTags.includes(filterId));
    }

    function initDragAndDrop() {
      sortableInstances.forEach(inst => inst.destroy());
      sortableInstances = [];

      document.querySelectorAll('.drop-zone').forEach(zone => {
        const sortable = new Sortable(zone, {
          group: 'mcoc-tierlist',
          animation: 150,
          disabled: !isAdmin,
          ghostClass: 'sortable-ghost',
          onEnd: function (evt) {
            const charId = evt.item.dataset.id;
            const targetTier = evt.to.dataset.tier;
            const targetClase = evt.to.dataset.clase;

            const charObj = characters.find(c => c.id === charId);
            if (!charObj) return;

            charObj.tier = targetTier;
            if (targetClase !== 'ALL') {
              charObj.clase = targetClase;
            }

            const orderedIdsInTarget = Array.from(evt.to.children).map(el => el.dataset.id);
            const others = characters.filter(c => !orderedIdsInTarget.includes(c.id));
            const reorderedTargetChars = orderedIdsInTarget.map(id => characters.find(c => c.id === id)).filter(Boolean);

            characters = [...others, ...reorderedTargetChars];
            persistChanges();
            renderBoard();
          }
        });
        sortableInstances.push(sortable);
      });
    }

    // =========================================================================
    // MODALES
    // =========================================================================
    function renderFormTagCheckboxes() {
      const container = document.getElementById('formTagsContainer');
      container.innerHTML = '';
      AVAILABLE_TAGS.forEach(tag => {
        const label = document.createElement('label');
        label.className = 'flex items-center gap-2 cursor-pointer text-xs text-gray-300';
        label.innerHTML = `<input type="checkbox" value="${tag.id}" class="char-tag-cb rounded bg-gray-800 border-gray-700"> <span class="px-1.5 py-0.5 rounded border text-[11px] ${tag.color}">${tag.label}</span>`;
        container.appendChild(label);
      });
    }

    function openFormModal(editId = null) {
      document.getElementById('charForm').reset();
      document.getElementById('editCharId').value = editId || '';
      
      if (editId) {
        const ch = characters.find(c => c.id === editId);
        if (!ch) return;
        document.getElementById('formModalTitle').innerText = `Editar: ${ch.name}`;
        document.getElementById('charName').value = ch.name;
        document.getElementById('charClass').value = ch.clase;
        document.getElementById('charImg').value = ch.img || '';
        document.getElementById('charNotes').value = ch.notes || '';
        document.getElementById('charYoutube').value = ch.youtube || '';
        document.querySelectorAll('.char-tag-cb').forEach(cb => {
          cb.checked = (ch.tags || []).includes(cb.value);
        });
      } else {
        document.getElementById('formModalTitle').innerText = 'Añadir Nuevo Personaje';
      }

      document.getElementById('formModal').classList.remove('hidden');
      document.getElementById('formModal').classList.add('flex');
    }

    function closeFormModal() {
      document.getElementById('formModal').classList.add('hidden');
      document.getElementById('formModal').classList.remove('flex');
    }

    function submitCharForm(e) {
      e.preventDefault();
      const editId = document.getElementById('editCharId').value;
      const name = document.getElementById('charName').value.trim();
      const clase = document.getElementById('charClass').value;
      const img = document.getElementById('charImg').value.trim();
      const notes = document.getElementById('charNotes').value.trim();
      const youtube = document.getElementById('charYoutube').value.trim();
      const selectedTags = Array.from(document.querySelectorAll('.char-tag-cb:checked')).map(cb => cb.value);

      if (editId) {
        const idx = characters.findIndex(c => c.id === editId);
        if (idx > -1) {
          characters[idx] = { ...characters[idx], name, clase, img, notes, youtube, tags: selectedTags };
        }
      } else {
        characters.push({
          id: 'c_' + Date.now(),
          name,
          clase,
          tier: 'BENCH',
          tags: selectedTags,
          notes,
          youtube,
          img
        });
      }

      persistChanges();
      closeFormModal();
      renderBoard();
    }

    function openDetailModal(charId) {
      const ch = characters.find(c => c.id === charId);
      if (!ch) return;

      document.getElementById('detailName').innerText = ch.name;
      document.getElementById('detailClassBadge').innerText = `Clase: ${ch.clase} | Tier: ${ch.tier === 'BENCH' ? 'Sin clasificar' : ch.tier}`;
      document.getElementById('detailNotes').innerText = ch.notes || 'Sin notas adicionales todavía.';

      const tagsContainer = document.getElementById('detailTags');
      tagsContainer.innerHTML = '';
      (ch.tags || []).forEach(tagId => {
        const tagObj = AVAILABLE_TAGS.find(t => t.id === tagId);
        if (tagObj) {
          const span = document.createElement('span');
          span.className = `text-xs px-2 py-0.5 rounded border font-medium ${tagObj.color}`;
          span.innerText = tagObj.label;
          tagsContainer.appendChild(span);
        }
      });

      const imgEl = document.getElementById('detailImg');
      if (ch.img) {
        imgEl.src = ch.img;
        imgEl.classList.remove('hidden');
      } else {
        imgEl.classList.add('hidden');
      }

      const videoSection = document.getElementById('detailVideoSection');
      const iframe = document.getElementById('detailYoutubeIframe');
      const embedUrl = getYoutubeEmbedUrl(ch.youtube);
      if (embedUrl) {
        iframe.src = embedUrl;
        videoSection.classList.remove('hidden');
      } else {
        iframe.src = '';
        videoSection.classList.add('hidden');
      }

      const adminActions = document.getElementById('adminActionsContainer');
      if (isAdmin) {
        adminActions.classList.remove('hidden');
        document.getElementById('btnEditExisting').onclick = () => {
          closeDetailModal();
          openFormModal(ch.id);
        };
        document.getElementById('btnDeleteChar').onclick = () => {
          if (confirm(`¿Eliminar a ${ch.name}?`)) {
            characters = characters.filter(item => item.id !== ch.id);
            persistChanges();
            closeDetailModal();
            renderBoard();
          }
        };
      } else {
        adminActions.classList.add('hidden');
      }

      document.getElementById('detailModal').classList.remove('hidden');
      document.getElementById('detailModal').classList.add('flex');
    }

    function closeDetailModal() {
      document.getElementById('detailYoutubeIframe').src = '';
      document.getElementById('detailModal').classList.add('hidden');
      document.getElementById('detailModal').classList.remove('flex');
    }

    function getYoutubeEmbedUrl(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : null;
    }

    initData();
  </script>
</body>
</html>
